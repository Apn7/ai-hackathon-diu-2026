<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Hackathon 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center p-4">
  <main class="w-full max-w-sm rounded-2xl bg-white shadow p-6 space-y-3">
    <h1 class="text-xl font-bold">AI Hackathon 2026</h1>
    <p>API status: <span id="status" class="font-mono">checking...</span></p>
  </main>
  <script>
    fetch("/api/health")
      .then(r => r.json())
      .then(d => document.getElementById("status").textContent = d.status)
      .catch(() => document.getElementById("status").textContent = "down");
  </script>
</body>
</html>
